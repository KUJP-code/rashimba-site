# HTML, sitemaps, and unversioned images should refresh promptly.
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, s-maxage=300, must-revalidate'
  # Vite fingerprints scripts, styles, and bundled fonts in these paths.
  - pattern: '/assets/*.js'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/assets/*.css'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/assets/*.woff2'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/assets/*.woff'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/404.html'
    headers:
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
